[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "computer-agent"
version = "0.1.0"
description = "A Python computer-use agent with screen perception and computer-control tools."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Pillow",
    "PyAutoGUI==0.9.54",
    "pytesseract==0.3.13",
    "pyperclip==1.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
