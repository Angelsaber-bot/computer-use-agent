<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Phase 03 Experiment 08 — Verified Click Fixture</title>
  <style>
    :root {
      color-scheme: light;
      --background: #f7f7f7;
      --foreground: #111111;
      --button-bg: #0047ff;
      --button-fg: #ffffff;
      --button-disabled-bg: #123d18;
      --status-bg: #ffffff;
      --status-border: #111111;
      --focus-ring: #ffbf00;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      margin: 0;
    }

    body {
      align-items: center;
      background: var(--background);
      color: var(--foreground);
      display: flex;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      justify-content: center;
      min-height: 100%;
    }

    main {
      align-items: center;
      display: flex;
      flex-direction: column;
      gap: 32px;
      padding: 32px;
      text-align: center;
      width: min(100%, 1100px);
    }

    h1 {
      font-size: clamp(28px, 4vw, 54px);
      font-weight: 800;
      line-height: 1.15;
      margin: 0;
    }

    #safe-click-target {
      appearance: none;
      background: var(--button-bg);
      border: 6px solid var(--foreground);
      border-radius: 8px;
      color: var(--button-fg);
      cursor: pointer;
      font: inherit;
      font-size: clamp(30px, 3.2vw, 64px);
      font-weight: 900;
      line-height: 1.1;
      min-height: 180px;
      padding: 32px 44px;
      text-align: center;
      width: min(100%, 980px);
    }

    #safe-click-target:focus-visible {
      outline: 8px solid var(--focus-ring);
      outline-offset: 6px;
    }

    #safe-click-target:disabled {
      background: var(--button-disabled-bg);
      cursor: default;
      opacity: 1;
    }

    #status-label {
      background: var(--status-bg);
      border: 4px solid var(--status-border);
      border-radius: 8px;
      color: var(--foreground);
      display: inline-block;
      font-size: clamp(28px, 4.5vw, 64px);
      font-weight: 800;
      line-height: 1.15;
      padding: 18px 28px;
      width: min(100%, 760px);
    }
  </style>
</head>
<body>
  <main>
    <h1>Phase 03 Experiment 08 — Verified Click Fixture</h1>
    <button id="safe-click-target" type="button">SAFE_CLICK_TARGET_08</button>
    <div id="status-label" aria-live="polite">WAITING_FOR_CLICK</div>
  </main>

  <script>
    const button = document.getElementById("safe-click-target");
    const statusLabel = document.getElementById("status-label");

    button.addEventListener("click", () => {
      button.textContent = "SAFE_CLICK_CONFIRMED_08";
      statusLabel.textContent = "CLICK_VERIFIED";
      button.disabled = true;
      document.body.dataset.clickVerified = "true";
    }, { once: true });
  </script>
</body>
</html>
