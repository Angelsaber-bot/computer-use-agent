<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PHASE04_RECOVERY_REGROUNDING_FIXTURE_05</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f2f2f2;
      --panel: #ffffff;
      --text: #111111;
      --border: #111111;
      --button: #ffffff;
      --complete: #d8f3dc;
    }

    * {
      box-sizing: border-box;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Courier New", Courier, monospace;
      margin: 0;
      padding: 24px;
    }

    main {
      background: var(--panel);
      border: 4px solid var(--border);
      margin: 0 auto;
      min-height: 620px;
      padding: 24px;
      position: relative;
      width: 980px;
    }

    h1 {
      font-size: 30px;
      font-weight: 900;
      line-height: 1.1;
      margin: 0;
      text-align: center;
    }

    #stage-05 {
      border: 4px dashed var(--border);
      height: 500px;
      margin-top: 24px;
      position: relative;
    }

    #recovery-action-target-05 {
      background: var(--button);
      border: 4px solid var(--border);
      color: var(--text);
      cursor: pointer;
      font: 900 26px/1 "Courier New", Courier, monospace;
      left: 72px;
      min-height: 64px;
      min-width: 340px;
      padding: 14px 18px;
      position: absolute;
      top: 86px;
    }

    #recovery-action-target-05.position-b {
      left: 542px;
      top: 344px;
    }

    #recovery-action-target-05.complete {
      background: var(--complete);
    }
  </style>
</head>
<body>
  <main aria-label="PHASE04_RECOVERY_REGROUNDING_FIXTURE_05">
    <h1>PHASE04_RECOVERY_REGROUNDING_FIXTURE_05</h1>
    <div id="stage-05">
      <button
        id="recovery-action-target-05"
        type="button"
        aria-label="ACTION_TARGET_05"
      >ACTION_TARGET_05</button>
    </div>
  </main>

  <script>
    const button = document.getElementById("recovery-action-target-05");
    let clickCount = 0;

    button.addEventListener("click", () => {
      clickCount += 1;

      if (clickCount === 1) {
        button.classList.add("position-b");
        button.textContent = "ACTION_TARGET_05";
        button.setAttribute("aria-label", "ACTION_TARGET_05");
        return;
      }

      button.classList.add("position-b", "complete");
      button.textContent = "VERIFICATION_TARGET_05";
      button.setAttribute("aria-label", "VERIFICATION_TARGET_05");
    });
  </script>
</body>
</html>
