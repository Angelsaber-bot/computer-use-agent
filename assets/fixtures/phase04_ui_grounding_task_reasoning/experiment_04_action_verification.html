<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PHASE04_ACTION_VERIFICATION_FIXTURE_04</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f4f4;
      --panel: #ffffff;
      --text: #111111;
      --border: #111111;
      --result-bg: #d8f3dc;
    }

    * {
      box-sizing: border-box;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Courier New", Courier, monospace;
      margin: 0;
      padding: 24px;
    }

    main {
      background: var(--panel);
      border: 4px solid var(--border);
      margin: 0 auto;
      max-width: 960px;
      padding: 24px;
    }

    h1 {
      font-size: 34px;
      font-weight: 900;
      line-height: 1.1;
      margin: 0 0 24px;
      text-align: center;
    }

    button,
    .result {
      border: 4px solid var(--border);
      color: var(--text);
      font: 900 28px/1 "Courier New", Courier, monospace;
      min-height: 64px;
      padding: 14px 18px;
    }

    button {
      background: #ffffff;
      cursor: pointer;
      min-width: 360px;
    }

    .result {
      background: var(--result-bg);
      margin-top: 24px;
    }
  </style>
</head>
<body>
  <main>
    <h1>PHASE04_ACTION_VERIFICATION_FIXTURE_04</h1>
    <button
      id="verification-action-target-04"
      type="button"
      aria-label="ACTION_TARGET_04"
    >ACTION_TARGET_04</button>
    <div id="result-slot-04"></div>
  </main>

  <script>
    const button = document.getElementById("verification-action-target-04");
    const resultSlot = document.getElementById("result-slot-04");

    button.addEventListener("click", () => {
      if (document.getElementById("verification-result-04")) {
        return;
      }

      const result = document.createElement("div");
      result.id = "verification-result-04";
      result.className = "result";
      result.setAttribute("role", "status");
      result.textContent = "VERIFICATION_TARGET_04";
      resultSlot.appendChild(result);
      button.textContent = "VERIFICATION_TARGET_04";
      button.setAttribute("aria-label", "VERIFICATION_TARGET_04");
    });
  </script>
</body>
</html>
